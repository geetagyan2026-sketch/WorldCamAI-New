name: Build APK Directly From Zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Stable Java 17)
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract AI Studio Project Zip
        run: |
          mkdir -p android-clean
          unzip -o "*.zip" -d android-clean/ || true

          find android-clean -name "AndroidManifest.xml" | while read -r MANIFEST_PATH; do
            if [ -f "$MANIFEST_PATH" ]; then
              sed -i 's/<uses-permission[^>]*\s*android:name="android.permission.INTERNET"\s*\/>//g' "$MANIFEST_PATH"
            fi
          done

      # [नया स्टेप]: ऐप के अंदर AI बैकग्राउंड रिमूवल की लाइब्रेरी जोड़ना
      - name: Inject ML Kit Dependencies for Background Removal
        run: |
          find android-clean -name "build.gradle" -o -name "build.gradle.kts" | while read -r GRADLE_FILE; do
            if grep -q "dependencies" "$GRADLE_FILE"; then
              echo "Adding ML Kit to $GRADLE_FILE"
              sed -i '/dependencies {/a \    implementation("com.google.mlkit:segmentation-selfie:16.0.0-beta4")' "$GRADLE_FILE"
            fi
          done

      # [नया स्टेप]: 2612 लाइनों वाले कोड में गैलरी से फोटो चुनते ही बैकग्राउंड हटाने का लॉजिक सेट करना
      - name: Inject Gallery AI Background Remover Logic
        run: |
          find android-clean -name "MainActivity.kt" -o -name "MainActivity.java" | while read -r MAIN_FILE; do
            echo "Injecting AI Studio code into $MAIN_FILE"
            sed -i '/class MainActivity/,$ { /^[[:space:]]*}$/i \
            override fun onActivityResult(requestCode: Int, resultCode: Int, data: android.content.Intent?) {\
                super.onActivityResult(requestCode, resultCode, data)\
                if (requestCode == 102 && resultCode == android.app.Activity.RESULT_OK) {\
                    val imageUri = data?.data ?: return\
                    val originalBitmap = android.provider.MediaStore.Images.Media.getBitmap(this.contentResolver, imageUri)\
                    removePhotoBackground(originalBitmap)\
                }\
            }\
            private fun removePhotoBackground(inputBitmap: android.graphics.Bitmap) {\
                val segmenter = com.google.mlkit.vision.segmentation.Segmentation.getClient(\
                    com.google.mlkit.vision.segmentation.selfie.SelfieSegmenterOptions.Builder()\
                        .setDetectorMode(com.google.mlkit.vision.segmentation.selfie.SelfieSegmenterOptions.SINGLE_IMAGE_MODE).build())\
                val inputImage = com.google.mlkit.vision.common.InputImage.fromBitmap(inputBitmap, 0)\
                segmenter.process(inputImage).addOnSuccessListener { mask ->\
                    val resultBitmap = android.graphics.Bitmap.createBitmap(inputBitmap.width, inputBitmap.height, android.graphics.Bitmap.Config.ARGB_8888)\
                    val buffer = mask.buffer; val w = mask.width; val h = mask.height\
                    for (y in 0 until h) { for (x in 0 until w) {\
                        if (buffer.float > 0.5) resultBitmap.setPixel(x, y, inputBitmap.getPixel(x, y))\
                        else resultBitmap.setPixel(x, y, android.graphics.Color.TRANSPARENT)\
                    }}\
                    buffer.rewind()\
                    findViewById<android.widget.ImageView>(resources.getIdentifier("liveSelfieImageView", "id", packageName))?.let { view ->\
                        view.setImageBitmap(resultBitmap)\
                        view.translationX = 0f; view.translationY = 0f; view.scaleX = 1.0f; view.scaleY = 1.0f\
                    }\
                }.addOnFailureListener {\
                    findViewById<android.widget.ImageView>(resources.getIdentifier("liveSelfieImageView", "id", packageName))?.setImageBitmap(inputBitmap)\
                }\
            }' "$MAIN_FILE"
          done

      - name: Setup Specific Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build with Gradle Directly
        run: |
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
            PROJECT_ROOT="android-clean"
          fi
          cd "$PROJECT_ROOT"
          echo "Working directory is: $(pwd)"
          export JAVA_HOME="${{ steps.setup-java.outputs.path }}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_OPTS="-Djava.awt.headless=true -Dorg.gradle.jvmargs=-Xmx2g -Djava.awt.headless=true"
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          mkdir -p "$GRADLE_USER_HOME"
          find . -name "gradle.properties" | while read -r PROP_FILE; do
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' "$PROP_FILE"
            echo "org.gradle.configuration-cache=false" >> "$PROP_FILE"
            echo "org.gradle.caching=false" >> "$PROP_FILE"
            echo "android.experimental.allowSmallerMinSdkVersion=true" >> "$PROP_FILE"
            echo "android.suppressUnsupportedCompileSdk=true" >> "$PROP_FILE"
            echo "org.gradle.jvmargs=-Xmx2048m" >> "$PROP_FILE"
            echo "android.oxos.compile.compiler.plugins.kotlin.suppressKotlinVersionCompatibilityCheck=true" >> "$PROP_FILE"
          done
          mkdir -p app/src/debug app/src/release
          JSON_CONTENT='{"project_info": {"project_number": "12345", "project_id": "mock-id", "storage_bucket": "://appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": "1:12345:android:67890", "android_client_info": {"package_name": "com.example.app"}}, "api_key": [{"current_key": "mock_key_here"}], "services": {"appinvite_service": {"status": 1}}}]}'
          echo "$JSON_CONTENT" > app/google-services.json
          echo "$JSON_CONTENT" > app/src/debug/google-services.json
          keytool -genkey -v -keystore app/debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000
          keytool -genkey -v -keystore debug.keystore -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload WorldCamAI-App Artifact
        uses: actions/artifacts@v4
        with:
          name: WorldCamAI-App
          path: |
            **/build/outputs/apk/debug/*.apk
