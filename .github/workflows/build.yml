name: Build APK Directly From Zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract AI Studio Project Zip
        run: |
          mkdir -p android-clean
          unzip -o "*.zip" -d android-clean/ || true

          if [ -d "android-clean/geeta-gian-sketch" ]; then
            cp -r android-clean/geeta-gian-sketch/* android-clean/
          fi

          # ऑटोमैटिक खराब परमिशन टैग को सही कोड से बदलना
          find android-clean -name "AndroidManifest.xml" | while read -r MANIFEST_PATH; do
            if [ -f "$MANIFEST_PATH" ]; then
              sed -i 's/<uses-permission[^>]*>/<uses-permission android:name="android.permission.INTERNET" \/>/g' "$MANIFEST_PATH"
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          cd android-clean
          if [ -d "clean" ]; then ./gradlew clean; fi

          # आपके असली पैकेज नाम (com.aistudio.worldcamai.kxmpzq) के साथ google-services.json सेट करना
          mkdir -p app/src/debug app/src/release app
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mobilesdk_app_id": "mock-id", "android_client_info": {"package_name": "com.aistudio.worldcamai.kxmpzq"}}, "api_key": [{"current_key": "mock-key"}]}]}' > app/src/debug/google-services.json
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mobilesdk_app_id": "mock-id", "android_client_info": {"package_name": "com.aistudio.worldcamai.kxmpzq"}}, "api_key": [{"current_key": "mock-key"}]}]}' > app/src/release/google-services.json

          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-App
          path: "**/build/outputs/apk/debug/*.apk"
