name: Build APK Directly From Zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract AI Studio Project Zip
        run: |
          mkdir -p android-clean
          unzip -o "*.zip" -d android-clean/ || true
          
          find android-clean -name "AndroidManifest.xml" | while read -r MANIFEST_PATH; do
            if [ -f "$MANIFEST_PATH" ]; then
              sed -i 's/<uses-permission[^>]*>\s*<\/uses-permission android:name="android.permission.INTERNET" \/>//g' "$MANIFEST_PATH"
            fi
          done

      - name: Setup Gradle (Without Cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
          cache-disabled: true

      - name: Build with Gradle
        run: |
          # उस मुख्य फोल्डर में जाना जहाँ settings.gradle.kts मौजूद है
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
            PROJECT_ROOT="android-clean"
          fi
          
          cd "$PROJECT_ROOT"
          echo "Working directory is: $(pwd)"
          
          # 1. गिटहब के सर्वर से पुराने खराब कैश फोल्डर्स को पूरी तरह साफ करना
          rm -rf .gradle
          rm -rf buildSrc/.gradle
          rm -rf app/.gradle
          rm -rf ~/.gradle/caches/
          
          # 2. gradle.properties फाइल में कॉन्फिगरेशन कैश को जबरन बंद करना
          if [ -f "gradle.properties" ]; then
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
            echo "org.gradle.configuration-cache=false" >> gradle.properties
          fi
          
          # 3. अगर gradlew फाइल नहीं है, तो उसे यहाँ जनरेट करें
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          
          chmod +x ./gradlew
          
          # 4. ज़रूरी मॉक फाइल्स बनाना
          mkdir -p app/src/debug app/src/release app
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mob"}}]}' > app/google-services.json
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mob"}}]}' > app/src/debug/google-services.json
          
          # 5. बिना किसी पुराने कैश के बिल्कुल फ्रेश बिल्ड शुरू करना
          ./gradlew clean assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-App
          path: "**/build/outputs/apk/debug/*.apk"
