name: Build APK Directly From Zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract AI Studio Project Zip
        run: |
          mkdir -p android-clean
          unzip -o "*.zip" -d android-clean/ || true
          
          # अगर ज़िप के अंदर कोई भी दूसरा फोल्डर बना है, तो उसकी सभी फाइलें बाहर लाएं
          find android-clean -name "AndroidManifest.xml" | while read -r MANIFEST_PATH; do
            if [ -f "$MANIFEST_PATH" ]; then
              sed -i 's/<uses-permission[^>]*>\s*<\/uses-permission android:name="android.permission.INTERNET" \/>//g' "$MANIFEST_PATH"
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          # पूरे वर्कस्पेस में gradlew फाइल को ढूंढें
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found anywhere in the repository!"
            exit 1
          fi
          
          # उस फोल्डर के अंदर जाएं जहाँ gradlew मौजूद है
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          
          # फाइल को रन करने की परमिशन दें
          chmod +x ./gradlew
          
          if [ -d "clean" ]; then ./gradlew clean; fi
          
          mkdir -p app/src/debug app/src/release app
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mob"}}]}' > app/google-services.json
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mob"}}]}' > app/src/debug/google-services.json
          
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-App
          path: "**/build/outputs/apk/debug/*.apk"
