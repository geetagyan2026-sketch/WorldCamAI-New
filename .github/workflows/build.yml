name: Build APK Directly From Zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (Stable Java 17)
        uses: actions/setup-java@v4
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract AI Studio Project Zip
        run: |
          mkdir -p android-clean
          unzip -o "*.zip" -d android-clean/ || true
          
          find android-clean -name "AndroidManifest.xml" | while read -r MANIFEST_PATH; do
            if [ -f "$MANIFEST_PATH" ]; then
              sed -i 's/<uses-permission[^>]*>\s*<\/uses-permission android:name="android.permission.INTERNET" \/>//g' "$MANIFEST_PATH"
            fi
          done

      - name: Setup Specific Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Build with Gradle Directly
        run: |
          # 1. मुख्य फोल्डर में जाना जहाँ settings.gradle.kts है
          PROJECT_ROOT=$(find . -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          
          if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" = "." ]; then
            PROJECT_ROOT="android-clean"
          fi
          
          cd "$PROJECT_ROOT"
          echo "Working directory is: $(pwd)"
          
          # 2. पर्यावरण वेरिएबल में Java 17 और हेडलेस मोड को लॉक करना
          export JAVA_HOME="${{ steps.setup-java.outputs.path }}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export GRADLE_OPTS="-Djava.awt.headless=true -Dorg.gradle.jvmargs=\"-Djava.awt.headless=true\""
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          
          # 3. पुराने कैशे को बाईपास करना
          export GRADLE_USER_HOME="${{ github.workspace }}/.custom_gradle_home"
          mkdir -p "$GRADLE_USER_HOME"
          
          # 4. सभी प्रॉपर्टीज फाइलों में आवश्यक सेटिंग्स जोड़ना
          find . -name "gradle.properties" | while read -r PROP_FILE; do
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' "$PROP_FILE"
            echo "org.gradle.configuration-cache=false" >> "$PROP_FILE"
            echo "org.gradle.caching=false" >> "$PROP_FILE"
            echo "android.experimental.allowSmallerMinSdkVersion=true" >> "$PROP_FILE"
            echo "android.suppressUnsupportedCompileSdk=true" >> "$PROP_FILE"
            echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx2048m" >> "$PROP_FILE"
            echo "androidx.compose.compiler.plugins.kotlin.suppressKotlinVersionCompatibilityCheck=true" >> "$PROP_FILE"
          done
          
          # 5. पैकेज नाम के साथ सही google-services.json बनाना
          mkdir -p app/src/debug app/src/release app
          JSON_CONTENT='{"project_info": {"project_number": "12345", "project_id": "mock-id", "storage_bucket": "://appspot.com"}, "client": [{"client_info": {"mobilesdk_app_id": "1:12345:android:12345", "android_client_info": {"package_name": "com.aistudio.worldcamai.kxmpzq"}}, "api_key": [{"current_key": "mock_key"}], "services": {"appinvite_service": {"status": 1}}}]}'
          echo "$JSON_CONTENT" > app/google-services.json
          echo "$JSON_CONTENT" > app/src/debug/google-services.json
          
          # 6. फिक्स: 'validateSigningDebug' एरर को रोकने के लिए खुद की डिफ़ॉल्ट debug.keystore चाबी बनाना
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 7. सिस्टम में इंस्टॉल्ड फ्रेश ग्रेडल 9.3.1 से सीधे बिल्ड शुरू करना
          gradle assembleDebug -Djava.awt.headless=true -Dorg.gradle.java.home="$JAVA_HOME" -Dorg.gradle.jvmargs="-Djava.awt.headless=true" -Pandroid.overrideVersionCheck=true -Pandroidx.compose.compiler.plugins.kotlin.suppressKotlinVersionCompatibilityCheck=true -x lint -x test --no-daemon --no-build-cache --no-configuration-cache --project-cache-dir="$GRADLE_USER_HOME/project_cache" --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-App
          path: "**/build/outputs/apk/debug/*.apk"
