name: Build APK Directly From Zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract AI Studio Project Zip
        run: |
          mkdir -p android-clean
          unzip -o *.zip -d android-clean/ || true
          
          if [ -d "android-clean/geeta-gian-sketch" ]; then
            cp -r android-clean/geeta-gian-sketch/* android-clean/
          fi

          # पूरे प्रोजेक्ट में जितनी भी AndroidManifest.xml फाइलें हैं, उन सबको ढूंढकर बिल्कुल सही कोड से बदलना
          find android-clean -name "AndroidManifest.xml" | while read -r MANIFEST_PATH; do
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$MANIFEST_PATH"
            echo '<manifest xmlns:android="http://github.com"' >> "$MANIFEST_PATH"
            echo '    xmlns:tools="http://github.com">' >> "$MANIFEST_PATH"
            echo '    <uses-permission android:name="android.permission.INTERNET" />' >> "$MANIFEST_PATH"
            echo '    <uses-permission android:name="android.permission.CAMERA" />' >> "$MANIFEST_PATH"
            echo '    <application' >> "$MANIFEST_PATH"
            echo '        android:allowBackup="true"' >> "$MANIFEST_PATH"
            echo '        android:icon="@mipmap/ic_launcher"' >> "$MANIFEST_PATH"
            echo '        android:label="WorldCamAI"' >> "$MANIFEST_PATH"
            echo '        android:roundIcon="@mipmap/ic_launcher_round"' >> "$MANIFEST_PATH"
            echo '        android:supportsRtl="true"' >> "$MANIFEST_PATH"
            echo '        android:theme="@style/Theme.AppCompat.Light.NoActionBar">' >> "$MANIFEST_PATH"
            echo '        <activity' >> "$MANIFEST_PATH"
            echo '            android:name="com.example.ui.MainActivity"' >> "$MANIFEST_PATH"
            echo '            android:exported="true">' >> "$MANIFEST_PATH"
            echo '            <intent-filter>' >> "$MANIFEST_PATH"
            echo '                <action android:name="android.intent.action.MAIN" />' >> "$MANIFEST_PATH"
            echo '                <category android:name="android.intent.category.LAUNCHER" />' >> "$MANIFEST_PATH"
            echo '            </intent-filter>' >> "$MANIFEST_PATH"
            echo '        </activity>' >> "$MANIFEST_PATH"
            echo '    </application>' >> "$MANIFEST_PATH"
            echo '</manifest>' >> "$MANIFEST_PATH"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          cd android-clean
          if [ -d "clean" ]; then cd clean; fi
          
          # पैकेज नाम के साथ नकली google-services.json सेट करना
          mkdir -p app/src/debug app/src/release app
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mobilesdk_app_id": "1:12345:android:12345", "android_client_info": {"package_name": "com.aistudio.worldcamai.kxmpzq"}}, "api_key": [{"current_key": "mock-key"}], "services": {"appinvite_service": {"status": 1}}}]}' > app/google-services.json
          echo '{"project_info": {"project_number": "12345", "project_id": "mock-id"}, "client": [{"client_info": {"mobilesdk_app_id": "1:12345:android:12345", "android_client_info": {"package_name": "com.aistudio.worldcamai.kxmpzq"}}, "api_key": [{"current_key": "mock-key"}], "services": {"appinvite_service": {"status": 1}}}]}' > app/src/debug/google-services.json

          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-App
          path: "**/build/outputs/apk/debug/*.apk"
