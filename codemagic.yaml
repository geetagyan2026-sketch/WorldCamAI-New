workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        ANDROID_NDK: "25.2.9519653"
      java: 17
    scripts:
      - name: Build APK
        script: |
          # यह कमांड आपकी ज़िप फ़ाइल के अंदर छिपे फ़ोल्डर को ढूँढकर उसमें चली जाएगी
          cd $(find . -maxdepth 2 -name "app" -print -quit | sed 's/\/app//') 2>/dev/null || cd * || true
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
