workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      vars:
        ANDROID_NDK: "25.2.9519653"
      java: 11
    scripts:
      - name: Build APK
        script: |
          # ज़िप फ़ाइल के अंदर छिपे प्रोजेक्ट फ़ोल्डर को ढूंढकर उसमें जाना
          cd $(find . -maxdepth 2 -name "AndroidManifest.xml" -print -quit | sed 's/\/app\/src\/main\/AndroidManifest.xml//' | sed 's/\/src\/main\/AndroidManifest.xml//') 2>/dev/null || true
          
          # Gradle को पुराने वर्जन 7.5 पर लॉक करना ताकि एरर न आए
          gradle wrapper --gradle-version 7.5
          
          # मिसिंग सेटिंग्स फ़ाइल को खुद जनरेट करना
          echo "include ':app'" > settings.gradle
          
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
